name: CI

# Runs on every PR regardless of base branch: stacked task PRs in this repo
# target feature branches, not main, and they need the gates too.
on:
  pull_request:
  push:
    branches: [main]

# Nothing here uses GITHUB_TOKEN; say so.
permissions:
  contents: read

# Superseded PR runs are cancelled; main runs are not, so every commit on
# main keeps its own verdict even when two merges land minutes apart.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fail fast and cheap. A lint error should cost ~40 seconds, not a Docker
  # pull and a full integration run.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm build

  # Real engines, real schema, real seed: the TB-004 acceptance line runs on
  # every PR. Smoke (TB-013) and E2E (TB-016) append their own steps here.
  integration:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ticketbox:ticketbox@localhost:5432/ticketbox
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner has no browsers; the version comes from the lockfile. Before
      # the stack, so a download failure is cheap and plainly not the code's.
      - run: pnpm --filter @ticketbox/web exec playwright install --with-deps chromium
      # --wait blocks on the compose healthchecks; nothing in CI opens
      # RedisInsight, so it is not started.
      - run: docker compose up -d --wait postgres redis
      - run: pnpm migrate
      - run: pnpm seed
      - run: pnpm test:integration
      # Smoke and E2E need the API, the web app and (E2E-3) the sweeper
      # worker. All run in the background against the same stack and seed;
      # /health and the web root gate the suites so a slow boot is a wait,
      # not a red run. The worker has no port, but it has a PID: a worker
      # that died during boot fails this step with its log, instead of
      # E2E-3 half a minute later. HOLD_TTL_MS=8000 is the test-only short
      # TTL (TB-028a), read by the API alone — the sweeper works from the
      # index's own scores: the expiry journey takes seconds instead of two
      # minutes, and no spec assumes the number. The logs are printed if
      # anything fails.
      - run: |
          HOLD_TTL_MS=8000 pnpm --filter @ticketbox/api exec tsx src/main/server.ts > api.log 2>&1 &
          pnpm --filter @ticketbox/api exec tsx src/worker/sweeper.ts > worker.log 2>&1 &
          WORKER_PID=$!
          pnpm --filter @ticketbox/web exec vite --port 5173 --strictPort > web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && curl -sf http://localhost:5173/ > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/health || { echo "API did not become healthy within 30s"; cat api.log; exit 1; }
          curl -sf http://localhost:5173/ > /dev/null || { echo "web app did not answer within 30s"; cat web.log; exit 1; }
          kill -0 "$WORKER_PID" 2>/dev/null || { echo "sweeper worker exited during boot"; cat worker.log; exit 1; }
      - run: pnpm test:smoke
      - run: pnpm test:e2e
      - if: failure()
        run: |
          docker compose logs
          cat api.log
          cat worker.log
          cat web.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: packages/web/test-results/
          if-no-files-found: ignore
